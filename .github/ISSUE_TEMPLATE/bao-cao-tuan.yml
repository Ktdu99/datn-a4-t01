name: "📋 Báo cáo tuần"
description: "Sinh viên mở mỗi tuần, chậm nhất 24 giờ trước buổi gặp"
title: "Tuần <N> — Báo cáo tiến độ"
labels: ["báo cáo tuần"]
body:
  - type: markdown
    attributes:
      value: |
        **Mỗi mục bằng chứng cần có liên kết GitHub** tới commit, file, hình hoặc log trong repository.
        Các đường dẫn trong ví dụ là đường dẫn tính từ thư mục gốc repository.
        Câu "em đã đọc / em đã tìm hiểu / gần xong" chưa đủ làm bằng chứng.
        Hãy ghi bài toán, đầu vào, đầu ra, phương pháp và điều chưa hiểu.

  - type: input
    id: tuan
    attributes:
      label: Tuần số / Gate đang hướng tới
      placeholder: "Tuần <số> · Gate <số> · hạn dd/mm"
    validations:
      required: true

  - type: textarea
    id: muc-tieu
    attributes:
      label: Mục tiêu tuần trước đã chốt
      placeholder: "1. Hoàn thiện testbench FIFO · 2. Kiểm tra các ca biên"
    validations:
      required: true

  - type: textarea
    id: bang-chung
    attributes:
      label: Đã làm được — kèm bằng chứng
      description: "Mỗi dòng ghi việc đã làm và liên kết GitHub tới bằng chứng."
      placeholder: |
        - Chạy testbench FIFO A → tb/tb_sync_fifo_count.sv
        - Log FIFO A, seed 1 → sim/logs/sync_fifo_count_seed_1.log
        - Waveform FIFO A → sim/waveforms/sync_fifo_count.vcd
        - Ảnh waveform A/B → demo/screenshots/01_gtkwave_fifo_ab.png
    validations:
      required: true

  - type: textarea
    id: cai-gi-hong
    attributes:
      label: Cái gì chưa chạy / đang lỗi
      description: "Ghi ca lỗi, kết quả mong đợi, kết quả thực tế và cách tái hiện. Nếu chưa ghi nhận lỗi, hãy nêu điều đó."
      placeholder: "Ví dụ: đọc và ghi đồng thời, kết quả thực tế lệch một phần tử ở chu kỳ ... "
    validations:
      required: true

  - type: textarea
    id: chan-doan
    attributes:
      label: Chẩn đoán và cách đã kiểm chứng
      description: "Ghi giả thuyết, cách kiểm tra, kết quả quan sát được và kết luận hiện tại."
      placeholder: |
        Giả thuyết: ...
        Đã thử: chạy FIFO B với seed 1; log: sim/logs/sync_fifo_pointer_seed_1.log
        Kết quả: ...
    validations:
      required: true

  - type: textarea
    id: de-xuat
    attributes:
      label: Đề xuất bước tiếp theo
      description: "Nêu việc bạn đề xuất làm tiếp và kết quả dự kiến."
      placeholder: "1. ... · 2. ..."
    validations:
      required: true

  - type: textarea
    id: cau-hoi
    attributes:
      label: Câu hỏi cho mentor
      placeholder: "Ghi câu hỏi cụ thể hoặc ghi Không có."
    validations:
      required: false

  - type: textarea
    id: ai
    attributes:
      label: Đã dùng AI thế nào tuần này
      description: "Ghi công cụ, mục đích sử dụng và cách bạn kiểm chứng kết quả."
      placeholder: "Dùng ... để ...; đã kiểm chứng bằng ... . Nếu không dùng, ghi Không sử dụng."
    validations:
      required: true
