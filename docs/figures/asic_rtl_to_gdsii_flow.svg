<rect width="1500" height="1430" fill="#f4f7fb"/>
<text x="750" y="60" font-size="31" fill="#214d7b" text-anchor="middle" font-weight="bold">QUY TRÌNH THIẾT KẾ ASIC TỪ RTL ĐẾN GDSII</text>
