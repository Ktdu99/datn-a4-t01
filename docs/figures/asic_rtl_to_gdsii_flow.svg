<text x="750" y="1365" font-size="17" fill="#32465d" text-anchor="middle">Mũi tên liền: chuỗi triển khai chính | Mũi tên nét đứt: hoạt động hỗ trợ / kiểm tra</text>
<text x="750" y="1387" font-size="16" fill="#52657b" text-anchor="middle">Hình mô tả quy trình nghiên cứu, không đại diện cho chứng nhận sign-off sản xuất.</text>
