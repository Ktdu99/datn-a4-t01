<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677e"/></marker></defs>
<rect width="1500" height="850" fill="#f4f7fb"/>
<text x="750" y="64" text-anchor="middle" font-size="36" font-weight="bold" fill="#087c74">FIFO B - Extended-pointer</text>
<text x="750" y="103" text-anchor="middle" font-size="20" fill="#43556b">Synchronous FIFO | DATA_WIDTH = 8 | DEPTH = 16</text>
<rect x="35" y="165" width="240" height="215" rx="15" fill="#ffffff" stroke="#087c74" stroke-width="2.5"/>
<rect x="35" y="165" width="240" height="48" rx="15" fill="#087c74"/>
<rect x="35" y="198" width="240" height="15" fill="#087c74"/>
<text x="53" y="196" font-size="20" font-weight="bold" fill="white">GIAO DIỆN</text>
<text x="53" y="247" font-size="18" fill="#243247">clk, rst_n</text>
<text x="53" y="276" font-size="18" fill="#243247">wr_en, rd_en</text>
<text x="53" y="305" font-size="18" fill="#243247">wr_data[7:0]</text>
<rect x="335" y="165" width="300" height="215" rx="15" fill="#ffffff" stroke="#087c74" stroke-width="2.5"/>
<rect x="335" y="165" width="300" height="48" rx="15" fill="#087c74"/>
<rect x="335" y="198" width="300" height="15" fill="#087c74"/>
<text x="353" y="196" font-size="20" font-weight="bold" fill="white">CON TRỎ ĐỌC / GHI</text>
<text x="353" y="247" font-size="18" fill="#243247">write_pointer[4:0]</text>
<text x="353" y="276" font-size="18" fill="#243247">read_pointer[4:0]</text>
<text x="353" y="305" font-size="18" fill="#243247">[3:0]: địa chỉ bộ nhớ</text>
<text x="353" y="334" font-size="18" fill="#243247">[4]: bit pha / vòng</text>
<rect x="695" y="165" width="315" height="215" rx="15" fill="#ffffff" stroke="#087c74" stroke-width="2.5"/>
<rect x="695" y="165" width="315" height="48" rx="15" fill="#087c74"/>
<rect x="695" y="198" width="315" height="15" fill="#087c74"/>
<text x="713" y="196" font-size="20" font-weight="bold" fill="white">BỘ NHỚ FIFO</text>
<text x="713" y="247" font-size="18" fill="#243247">memory[0:15]</text>
<text x="713" y="276" font-size="18" fill="#243247">Mỗi phần tử: 8 bit</text>
<text x="713" y="305" font-size="18" fill="#243247">Ghi: write_accept</text>
<text x="713" y="334" font-size="18" fill="#243247">Đọc: read_accept</text>
<rect x="1070" y="165" width="395" height="215" rx="15" fill="#ffffff" stroke="#087c74" stroke-width="2.5"/>
<rect x="1070" y="165" width="395" height="48" rx="15" fill="#087c74"/>
<rect x="1070" y="198" width="395" height="15" fill="#087c74"/>
<text x="1088" y="196" font-size="20" font-weight="bold" fill="white">ĐẦU RA DỮ LIỆU</text>
<text x="1088" y="247" font-size="18" fill="#243247">rd_data[7:0]</text>
<text x="1088" y="276" font-size="18" fill="#243247">Đầu ra có thanh ghi</text>
<text x="1088" y="305" font-size="18" fill="#243247">Cập nhật khi read_accept</text>
<text x="1088" y="334" font-size="18" fill="#243247">Giữ giá trị khi không đọc</text>
<rect x="35" y="490" width="350" height="245" rx="15" fill="#ffffff" stroke="#087c74" stroke-width="2.5"/>
<rect x="35" y="490" width="350" height="48" rx="15" fill="#087c74"/>
<rect x="35" y="523" width="350" height="15" fill="#087c74"/>
<text x="53" y="521" font-size="20" font-weight="bold" fill="white">SO SÁNH CON TRỎ</text>
<text x="53" y="572" font-size="18" fill="#243247">same_address:</text>
<text x="53" y="601" font-size="18" fill="#243247">wr_ptr[3:0] == rd_ptr[3:0]</text>
<text x="53" y="630" font-size="18" fill="#243247">different_phase:</text>
<text x="53" y="659" font-size="18" fill="#243247">wr_ptr[4] != rd_ptr[4]</text>
<text x="53" y="688" font-size="18" fill="#243247">Không sử dụng data_count</text>
<rect x="445" y="490" width="490" height="245" rx="15" fill="#ffffff" stroke="#087c74" stroke-width="2.5"/>
<rect x="445" y="490" width="490" height="48" rx="15" fill="#087c74"/>
<rect x="445" y="523" width="490" height="15" fill="#087c74"/>
<text x="463" y="521" font-size="20" font-weight="bold" fill="white">TRẠNG THÁI / ĐIỀU KHIỂN</text>
<text x="463" y="572" font-size="18" fill="#243247">empty = (wr_ptr == rd_ptr)</text>
<text x="463" y="601" font-size="18" fill="#243247">full = same_address &amp;&amp;</text>
<text x="463" y="630" font-size="18" fill="#243247">       different_phase</text>
<text x="463" y="659" font-size="18" fill="#243247">write_accept = wr_en &amp;&amp; !full</text>
<text x="463" y="688" font-size="18" fill="#243247">read_accept = rd_en &amp;&amp; !empty</text>
<rect x="995" y="490" width="470" height="245" rx="15" fill="#ffffff" stroke="#087c74" stroke-width="2.5"/>
<rect x="995" y="490" width="470" height="48" rx="15" fill="#087c74"/>
<rect x="995" y="523" width="470" height="15" fill="#087c74"/>
<text x="1013" y="521" font-size="20" font-weight="bold" fill="white">CỜ GIAO DỊCH KHÔNG HỢP LỆ</text>
<text x="1013" y="572" font-size="18" fill="#243247">overflow &lt;= wr_en &amp;&amp; full</text>
<text x="1013" y="601" font-size="18" fill="#243247">underflow &lt;= rd_en &amp;&amp; empty</text>
<text x="1013" y="630" font-size="18" fill="#243247">Cả hai là đầu ra có thanh ghi</text>
<text x="1013" y="659" font-size="18" fill="#243247">Giá trị cập nhật từng chu kỳ</text>
<path d="M 275 270 L 335 270" fill="none" stroke="#52677e" stroke-width="2.8" marker-end="url(#arrow)"/>
<path d="M 635 270 L 695 270" fill="none" stroke="#52677e" stroke-width="2.8" marker-end="url(#arrow)"/>
<text x="665.0" y="258.0" text-anchor="middle" font-size="15" fill="#43556b">địa chỉ</text>
<path d="M 1010 270 L 1070 270" fill="none" stroke="#52677e" stroke-width="2.8" marker-end="url(#arrow)"/>
<path d="M 385 615 L 445 615" fill="none" stroke="#52677e" stroke-width="2.8" marker-end="url(#arrow)"/>
<path d="M 935 615 L 995 615" fill="none" stroke="#52677e" stroke-width="2.8" marker-end="url(#arrow)"/>
<rect x="35" y="769" width="1430" height="49" rx="10" fill="#e7edf5"/>
<text x="750" y="799" text-anchor="middle" font-size="18" fill="#34465c">Các thanh ghi cập nhật tại cạnh lên clk; rst_n là reset đồng bộ tích cực mức thấp.</text>
</svg>
